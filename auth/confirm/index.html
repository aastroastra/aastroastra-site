<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in | AastroAstra</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">AastroAstra</p>
    <h1>Continue in the app</h1>
    <p id="message" role="status">Open AastroAstra to finish signing in securely.</p>
    <a id="open-app" class="button" hidden>Open AastroAstra</a>
    <p class="hint">You can also enter the six-digit code from your email in the app. Use the newest email if you requested another code.</p>
    <a href="/">Get the Android app</a>
    <noscript>Enable JavaScript to open this link, or enter the code from your email directly in the app.</noscript>
  </main>
</body>
</html>
