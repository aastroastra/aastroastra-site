name: Tagged release and regression report

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* or release-* tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tagged-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: aastroastra/aastroastra-site/.github/workflows/project-release.yml@17a1bc0be9132c0dc80a06ca9f6f4e61b5c2143e
    with:
      platform: site
      tag: ${{ inputs.tag || github.ref_name }}
      toolkit_ref: 17a1bc0be9132c0dc80a06ca9f6f4e61b5c2143e
