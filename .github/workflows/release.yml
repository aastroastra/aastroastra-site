name: Tagged release and regression report

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* or release-* tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tagged-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: aastroastra/aastroastra-site/.github/workflows/project-release.yml@bff31f5704e44198b4a0a8bc9efc581d0bad64fa
    with:
      platform: site
      tag: ${{ inputs.tag || github.ref_name }}
      toolkit_ref: bff31f5704e44198b4a0a8bc9efc581d0bad64fa
