# Blocks a credential from reaching the default branch.
#
# This scans the working tree rather than git history on purpose: history holds
# one already-rotated key that cannot be removed without rewriting published
# commits, and a check that is permanently red is a check nobody reads. Rotation
# is what makes a leaked key harmless; this stops the next one landing at all.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    # Monday 03:00 UTC, so a rule update catches anything already merged.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
