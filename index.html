<style>
  /* Four solid themes: Yellow / B&W  ×  Light / Dark (inverts). No gradients. */
  [data-theme="yellow-light"] { --bg:#FFFFFF; --card:#FFFFFF; --line:#ECE6D8; --fg:#1A1A1A; --fg2:#565043; --muted:#8C8676; --tint:#E0A015; --on-accent:#1A1A1A; --cosmos:55,55,55; --pa:#F5B93A; --btn-bg:#0B0B0C; --btn-fg:#FFFFFF; }
  [data-theme="white-light"] { --bg:#FFFFFF; --card:#FFFFFF; --line:#ECECEC; --fg:#1A1A1A; --fg2:#565043; --muted:#8C8C8C; --tint:#F0632E; --on-accent:#FFFFFF; --cosmos:55,55,55; --pa:#FB8C3A; --btn-bg:#0B0B0C; --btn-fg:#FFFFFF; }
  [data-theme="mono-light"]   { --bg:#FFFFFF; --card:#FFFFFF; --line:#E6E6E6; --fg:#0A0A0A; --fg2:#4A4A4A; --muted:#8A8A8A; --tint:#0A0A0A; --on-accent:#FFFFFF; --cosmos:40,40,40;   --pa:#EDEDED; --btn-bg:#0A0A0A; --btn-fg:#FFFFFF; }
  [data-theme="yellow-dark"]  { --bg:#0B0B0C; --card:#151515; --line:#242424; --fg:#F4F4F4; --fg2:#BDBDBD; --muted:#7C7C7C; --tint:#F5B93A; --on-accent:#0B0B0C; --cosmos:225,225,225; --pa:#F5B93A; --btn-bg:#FAFAFA; --btn-fg:#0B0B0C; }
  [data-theme="mono-dark"]    { --bg:#0A0A0A; --card:#141414; --line:#262626; --fg:#FAFAFA; --fg2:#C8C8C8; --muted:#7A7A7A; --tint:#FAFAFA; --on-accent:#0A0A0A; --cosmos:235,235,235; --pa:#EDEDED; --btn-bg:#FAFAFA; --btn-fg:#0A0A0A; }
  /* Tint fill: yellow->orange gradient for the yellow themes, solid for mono */
  [data-theme="yellow-light"], [data-theme="yellow-dark"] { --tint-grad:linear-gradient(100deg,#FACC15 0%,#FB923C 55%,#EAB308 100%); }
  [data-theme="white-light"] { --tint-grad:linear-gradient(100deg,#FB8C3A 0%,#F0632E 55%,#E4551F 100%); }
  [data-theme="mono-light"], [data-theme="mono-dark"] { --tint-grad:var(--tint); }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html, body, #root { height:100%; max-width:100%; }
  body { background:var(--bg); color:var(--fg); overflow-x:hidden; overflow-y:auto; font-family:'Inter','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; letter-spacing:-0.01em; transition:background .3s ease,color .3s ease; }
  a { color:inherit; text-decoration:none; }

  .cosmos { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.8; }
  .frame { position:relative; z-index:1; width:100%; max-width:1240px; min-height:100vh; margin:0 auto; display:grid; grid-template-rows:auto auto auto auto auto; border-left:1px solid var(--line); border-right:1px solid var(--line); }

  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 30px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
  /* Logo follows the theme: gold gradient (Yellow themes) or ink/white (B&W), via a mask */
  .mark { width:28px; height:28px; display:inline-block; flex:none; background:var(--tint-grad); -webkit-mask:url(logo-mark.png) center/contain no-repeat; mask:url(logo-mark.png) center/contain no-repeat; }
  .brand small { font-weight:600; color:var(--muted); letter-spacing:.16em; font-size:10px; text-transform:uppercase; }
  .controls { display:flex; align-items:center; gap:10px; position:relative; }
  .seg, .themes { display:flex; gap:4px; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .seg button { border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:999px; font:inherit; font-size:12px; font-weight:600; padding:5px 11px; min-width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; transition:all .15s ease; }
  .seg button[aria-pressed="true"] { background:var(--tint-grad); color:var(--on-accent); }
  .themes button { border:1.5px solid transparent; background:transparent; border-radius:999px; width:30px; height:30px; padding:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:border-color .15s ease; }
  .themes button[aria-pressed="true"] { border-color:var(--tint); }
  .chip { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(140,140,140.42); }

  .chip i { width:8px; height:8px; border-radius:50%; }
  /* Mobile theme dropdown picker (avoids a horizontal row of 5 swatches) */
  .theme-picker { display:none; }
  .tp-btn { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:5px 10px 5px 6px; background:transparent; cursor:pointer; font:inherit; color:var(--fg); height:34px; }
  .tp-lbl { font-size:12px; font-weight:600; white-space:nowrap; }

  .tp-menu button { display:flex; align-items:center; gap:10px; background:transparent; border:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--fg); padding:9px 10px; border-radius:9px; text-align:left; width:100%; }
  .tp-menu button[aria-pressed="true"] { background:var(--card); border:1px solid var(--line); }

  .hero { display:grid; grid-template-columns:1fr 0.9fr; min-height:calc(100vh - 67px); }

  .engines { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .eng-cap { position:absolute; top:1%; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; white-space:nowrap; }
  .engine { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 11px; max-width:178px; box-shadow:0 14px 34px -16px rgba(0,0,0.34); }

  .engine .en .tm { font-size:8px; color:var(--muted); }
  .engine .ed { margin-top:3px; font-size:10px; line-height:1.35; color:var(--muted); }
  .engine.e0 { top:13%; left:0; }
  .engine.e1 { top:47%; right:0; }
  .engine.e2 { bottom:11%; left:2%; }

  h1 { font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-0.03em; font-size:clamp(46px,7vw,104px); line-height:0.98; color:var(--tint); }

  [data-theme="yellow-light"] h1, [data-theme="yellow-dark"] h1 { background:linear-gradient(100deg,#FACC15 0%,#FB923C 52%,#EAB308 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  [data-theme="white-light"] h1 { background:linear-gradient(100deg,#FB8C3A 0%,#F0632E 52%,#E4551F 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .dl-label { margin-top:36px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }

  .btn-play:hover { transform:translateY(-1px); filter:brightness(1.05); }

  .store-badge:hover { transform:translateY(-1px); filter:brightness(1.08); }

  .store-badge .txt small { display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; line-height:1.2; }

  .meta { margin-top:14px; font-size:13px; color:var(--muted); }

  @keyframes cue { 0%,100%{ transform:translateX(-50%) translateY(0); opacity:.7; } 50%{ transform:translateX(-50%) translateY(6px); opacity:1; } }

  [data-theme="mono-dark"] .feat-phone { --d-bg:#0A0A0A; --d-card:#161616; --d-c2:#1E1E1E; --d-line:#2A2A2A; --d-tp:#FAFAFA; --d-tm:#9A9A9A; --d-gold:#FAFAFA; --d-rose:#8A8A8A; --d-teal:#BFBFBF; --d-grad:#FAFAFA; --d-onaccent:#0A0A0A; --d-k:#FAFAFA; --d-kfg:#0A0A0A; }

  /* In-app top bar for feature screens (back chevron + centred brand mark), mirrors the Android detail-screen chrome. */

  /* Floating "zoom lens": a magnified close-up of one component, overlapping the phone (doesn't tilt with it). */
  .zoomlens { position:absolute; z-index:6; background:var(--d-card); border:1px solid var(--d-line); border-radius:18px; box-shadow:0 34px 66px -26px rgba(0,0,0.55), 0 0 0 1px rgba(0,0,0.03); padding:13px 14px 14px; animation:lensfloat 6s ease-in-out infinite; }

  .phone:hover { transform:translateY(-5px); }

  .foot-bar { display:flex; flex-direction:column; gap:6px; padding:16px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }

  @media (max-width:900px) {
    html, body, #root { height:auto; } body { overflow-y:auto; overflow-x:hidden; }
    .frame { height:auto; min-height:100vh; }
    .hero { grid-template-columns:1fr; }
    /* Mobile: the first screen shows ONLY the title + download + version, centred and
       filling the viewport; the phone mock sits below, revealed on scroll (with a cue). */
    .hero .left { border-right:none; border-bottom:1px solid var(--line); align-items:center; text-align:center; justify-content:center; position:relative; min-height:calc(100vh - 66px); padding:40px 22px 70px; }
    .dl-label, .meta, .apk-direct { text-align:center; }
    .btn-play { justify-content:center; }
    .hero .right { padding:34px 20px 52px; }
    .scrollcue { display:flex; }
    /* Footer: hide the compact desktop bar, show the full branded footer */
    .foot-simple { display:none; }
    .foot-big { display:block; }
  }
  @media (max-width:560px) {
    header { flex-wrap:wrap; row-gap:12px; padding:16px 18px; }
    .brand { flex:1 1 auto; } .controls { width:100%; justify-content:space-between; }
    /* Themes: use a compact dropdown picker instead of a 5-swatch row (no h-scroll) */
    .themes { display:none; }
    .theme-picker { display:block; }
    .hero > div { padding:30px 18px; } h1 { font-size:clamp(38px,12vw,64px); }
    /* Smaller phone on real mobile */
    .phone { width:248px; height:min(508px, calc(100vh - 120px)); border-radius:38px; padding:9px; }
    .phone .screen { border-radius:30px; }
  }
  /* Intro splash: logo + typewriter wordmark, then the logo flies into the nav */
  #splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#FFFFFF; transition:opacity .5s ease; }
  #splash .slogo { width:94px; height:94px; display:inline-block; background:var(--tint-grad); -webkit-mask:url(logo-mark.png) center/contain no-repeat; mask:url(logo-mark.png) center/contain no-repeat; animation:splashIn 1s cubic-bezier(.2.7.2,1) both; will-change:transform; }
  #splash .stype { font-family:'Noto Serif',Georgia,serif; font-size:27px; font-weight:700; letter-spacing:-.02em; color:#1A1A1A; min-height:34px; display:flex; align-items:center; border-right:2px solid currentColor; animation:caret .9s step-end infinite; }
  #splash.hide { opacity:0; pointer-events:none; }
  @keyframes splashIn { 0%{ opacity:0; transform:scale(.82); } 100%{ opacity:1; transform:scale(1); } }
  @keyframes caret { 0%,100%{ border-color:currentColor; } 50%{ border-color:transparent; } }


  /* ============ AastroAI, the deterministic core  AI layer story ============ */
  .aai { border-top:1px solid var(--line); padding:74px 30px 84px; }
  .aai-head { text-align:center; max-width:860px; margin:0 auto; }
  .aai-head .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--tint); font-weight:800; }
  .aai-head h2 { font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-.025em; font-size:clamp(30px,5.4vw,60px); line-height:1.03; margin-top:14px; color:var(--fg); }
  .aai-head h2 .hl { background:var(--tint-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .aai-head p { margin:16px auto 0; font-size:clamp(15px,1.7vw,18px); line-height:1.6; color:var(--fg2); max-width:640px; }

  /* The question, as the hero of the whole section. */
  .aai-q { max-width:900px; margin:56px auto 0; text-align:center; }
  .aai-q .lab { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); font-weight:800; }
  .aai-q .txt { margin-top:12px; font-family:'Noto Serif',Georgia,serif; font-weight:700; font-size:clamp(26px,5vw,52px); line-height:1.12; letter-spacing:-.02em; color:var(--tint); }

  /* The chain of proof, a keynote build: the spine draws itself, each step
     rises in as it arrives, and the numeral fills when the step lands. */
  .aai-chain { max-width:760px; margin:56px auto 0; position:relative; }
  .aai-chain .spine { position:absolute; left:31px; top:34px; bottom:34px; width:2px;
    background:linear-gradient(to bottom, color-mix(in srgb, var(--tint) 70%, transparent), color-mix(in srgb, var(--tint) 10%, transparent));
    transform-origin:top; transition:transform 1.5s cubic-bezier(.16,1.3,1); }
  html.js-reveal .aai-chain .spine { transform:scaleY(0); }
  html.js-reveal .aai-chain.in .spine { transform:scaleY(1); }
  .aai-step { position:relative; display:flex; gap:26px; align-items:flex-start; padding:22px 0;
    transition:opacity .85s cubic-bezier(.16,1.3,1), transform .85s cubic-bezier(.16,1.3,1); }
  html.js-reveal .aai-step { opacity:0; transform:translateY(26px); }
  html.js-reveal .aai-step.in { opacity:1; transform:none; }
  .aai-step .n { flex:none; width:64px; height:64px; border-radius:50%; display:grid; place-items:center;
    font-family:'Noto Serif',Georgia,serif; font-size:23px; font-weight:700; color:var(--tint);
    background:var(--bg); border:2px solid color-mix(in srgb, var(--tint) 30%, var(--line));
    position:relative; z-index:1; transition:border-color .6s ease, box-shadow .6s ease, transform .6s cubic-bezier(.16,1.3,1); }
  .aai-step.in .n { border-color:color-mix(in srgb, var(--tint) 75%, transparent);
    box-shadow:0 0 0 6px color-mix(in srgb, var(--tint) 8%, transparent); }
  .aai-step .body { padding-top:8px; min-width:0; }
  .aai-step .k { font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:800; color:var(--muted); }
  .aai-step .v { margin-top:8px; font-size:clamp(20px,3vw,30px); line-height:1.28; font-weight:600; color:var(--fg2); letter-spacing:-.015em; }
  .aai-step .v em { font-style:normal; font-weight:800; color:var(--fg); }
  .aai-step .v b { font-style:normal; font-weight:800; color:var(--tint); }

  /* The verdict, one big number, because the score is the honest part. */
  .aai-verdict { max-width:720px; margin:20px auto 0; border:1px solid color-mix(in srgb, var(--tint) 42%, var(--line));
    border-radius:22px; background:var(--card); padding:26px 26px 24px; display:flex; align-items:center; gap:26px; }
  .aai-verdict .score { flex:none; font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-.03em;
    font-size:clamp(46px,9vw,78px); line-height:.9;
    background:var(--tint-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .aai-verdict .rt .k { font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:800; color:var(--tint); }
  .aai-verdict .rt .v { margin-top:6px; font-size:clamp(19px,2.7vw,26px); font-weight:800; line-height:1.25; color:var(--fg); letter-spacing:-.01em; }
  .aai-verdict .rt .s { margin-top:5px; font-size:14px; color:var(--muted); }

  /* Only now does the model speak. */
  .aai-say { max-width:720px; margin:22px auto 0; text-align:center; }
  .aai-say .lab { font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:800; color:var(--muted); }
  .aai-say .quote { margin-top:12px; font-family:'Noto Serif',Georgia,serif; font-size:clamp(18px,2.6vw,25px);
    line-height:1.45; color:var(--fg); font-style:italic; }

  /* The conclusion, in two halves. */
  .aai-cmp { max-width:900px; margin:56px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .aai-cmp div { border:1px solid var(--line); border-radius:20px; padding:24px 22px; background:var(--card); }
  .aai-cmp div.ours { border-color:color-mix(in srgb, var(--tint) 45%, var(--line)); }
  .aai-cmp h4 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:var(--muted); }
  .aai-cmp div.ours h4 { color:var(--tint); }
  .aai-cmp .big { margin-top:12px; font-size:clamp(19px,2.6vw,26px); line-height:1.3; font-weight:700; color:var(--fg2); letter-spacing:-.01em; }
  .aai-cmp div.ours .big { color:var(--fg); }
  .aai-cmp .sm { margin-top:10px; font-size:14px; line-height:1.55; color:var(--muted); }

  /* The gate: who reads the rules before they speak. */
  .aai-gate { max-width:860px; margin:72px auto 0; }
  .aai-gate .lead { text-align:center; }
  .aai-gate .lead .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--tint); font-weight:800; }
  .aai-gate .lead h3 { margin-top:12px; font-family:'Noto Serif',Georgia,serif; font-weight:700;
    font-size:clamp(24px,4vw,40px); line-height:1.12; letter-spacing:-.02em; color:var(--fg); }
  .aai-gate .lead p { margin:14px auto 0; max-width:620px; font-size:clamp(14px,1.6vw,17px); line-height:1.6; color:var(--fg2); }

  .aai-rule { margin:36px auto 0; border:1px solid var(--line); border-radius:20px; background:var(--card); overflow:hidden; }
  .aai-rule .rows { padding:6px 0; }
  .aai-rule .row { display:flex; gap:16px; align-items:flex-start; padding:14px 22px; }
  .aai-rule .row + .row { border-top:1px dashed var(--line); }
  .aai-rule .row .k { flex:none; width:118px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:800; color:var(--muted); padding-top:4px; }
  .aai-rule .row .v { font-size:clamp(15px,1.9vw,19px); line-height:1.45; color:var(--fg2); font-weight:500; }
  .aai-rule .row .v em { font-style:normal; font-weight:800; color:var(--fg); }
  .aai-rule .row .v b { font-style:normal; font-weight:800; color:var(--tint); }
  .aai-rule .row .v code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.86em; color:var(--muted); }
  .aai-verdicts { display:flex; flex-wrap:wrap; gap:9px; padding:16px 22px 20px; border-top:1px solid var(--line);
    background:color-mix(in srgb, var(--tint) 4%, transparent); }
  .aai-verdicts span { font-size:13px; font-weight:700; padding:9px 15px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .aai-verdicts span.on { border-color:color-mix(in srgb, var(--tint) 55%, transparent); color:var(--tint); }

  .aai-notes { margin:22px auto 0; display:grid; gap:12px; }
  .aai-note { border:1px solid var(--line); border-left:3px solid color-mix(in srgb, var(--tint) 55%, transparent);
    border-radius:14px; padding:15px 18px; background:var(--card); }
  .aai-note .q { font-size:clamp(14px,1.7vw,17px); line-height:1.55; color:var(--fg); font-weight:500; }
  .aai-note .m { margin-top:7px; font-size:12px; color:var(--muted); }
  /* The ruleset is not a finished object. Three states, then the version that
     answered you, so "it changes" reads as discipline rather than drift. */
  .aai-life { margin:34px auto 0; max-width:860px; }
  .aai-life .lh { text-align:center; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    font-weight:800; color:var(--tint); }
  .aai-steps3 { margin-top:18px; display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:12px; align-items:center; }
  .aai-steps3 .st { border:1px solid var(--line); border-radius:16px; background:var(--card); padding:18px 14px; text-align:center; }
  .aai-steps3 .st .k { font-size:clamp(15px,1.9vw,19px); font-weight:800; color:var(--fg); letter-spacing:-.01em; }
  .aai-steps3 .st .v { margin-top:8px; font-size:clamp(12.5px,1.5vw,14.5px); line-height:1.45; color:var(--muted); }
  .aai-steps3 .to { color:var(--muted); opacity:.5; font-size:17px; }
  .aai-ver { margin-top:20px; text-align:center; }
  .aai-ver code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
    border:1px solid color-mix(in srgb, var(--tint) 45%, var(--line)); border-radius:999px;
    padding:7px 14px; color:var(--tint); background:color-mix(in srgb, var(--tint) 7%, transparent); }
  .aai-status { margin:20px auto 0; text-align:center; font-size:clamp(13px,1.6vw,15.5px); line-height:1.6; color:var(--muted); max-width:680px; }
  .aai-status b { color:var(--fg); font-weight:700; }
  @media (max-width:700px){
    .aai-steps3 { grid-template-columns:1fr; }
    .aai-steps3 .to { transform:rotate(90deg); }
  }

  .arv { transition:opacity .8s cubic-bezier(.16,1.3,1), transform .8s cubic-bezier(.16,1.3,1); }
  html.js-reveal .arv { opacity:0; transform:translateY(22px); }
  html.js-reveal .arv.in { opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce) {
    .arv, .aai-step { opacity:1 !important; transform:none !important; }
    .aai-chain .spine { transform:scaleY(1) !important; }
  }

  /* ── Engines: numerology, palmistry, face. Each one is a big visual that
        animates itself in, next to the arithmetic behind it. ── */
  .eng { border-top:1px solid var(--line); padding:76px 30px 88px; }
  .eng-head { text-align:center; max-width:820px; margin:0 auto; }
  .eng-head .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--tint); font-weight:800; }
  .eng-head h2 { margin-top:12px; font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-.025em;
    font-size:clamp(28px,4.8vw,54px); line-height:1.05; color:var(--fg); }
  .eng-head p { margin:16px auto 0; max-width:600px; font-size:clamp(15px,1.7vw,18px); line-height:1.6; color:var(--fg2); }

  .eng-block { max-width:1020px; margin:64px auto 0; display:grid; grid-template-columns:0.9fr 1.1fr; gap:48px; align-items:center; }
  .eng-block.flip .eng-art { order:2; }
  .eng-art { display:flex; align-items:center; justify-content:center; min-height:300px; }
  .eng-copy .tag { font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:800; color:var(--tint); }
  .eng-copy .tag.soon { color:var(--muted); }
  .eng-copy h3 { margin-top:10px; font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-.02em;
    font-size:clamp(24px,3.6vw,40px); line-height:1.12; color:var(--fg); }
  .eng-copy .sub { margin-top:12px; font-size:clamp(15px,1.8vw,19px); line-height:1.55; color:var(--fg2); }
  .eng-calc { margin-top:22px; border:1px solid var(--line); border-radius:16px; background:var(--card); padding:16px 18px; }
  .eng-calc .h { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--muted); }
  .eng-calc .l { margin-top:9px; font-size:clamp(14px,1.7vw,17px); line-height:1.5; color:var(--fg2); }
  .eng-calc .l b { color:var(--tint); font-weight:800; }
  .eng-calc .l em { font-style:normal; color:var(--fg); font-weight:700; }
  .eng-calc .l + .l { margin-top:6px; }

  /* Legend for the palm marks: each line has its own colour and its own meaning. */
  .eng-legend { margin-top:20px; display:grid; gap:9px; }
  .eng-legend div { display:flex; align-items:baseline; gap:10px; font-size:clamp(13.5px,1.6vw,16px); line-height:1.45; color:var(--fg2); }
  .eng-legend i { flex:none; width:11px; height:11px; border-radius:50%; transform:translateY(1px); }
  .eng-legend b { color:var(--fg); font-weight:700; }

  /* Drawing: the strokes trace themselves once the block arrives. */
  .eng-art svg { width:100%; max-width:330px; height:auto; overflow:visible; }
  .trace { stroke-dasharray:1; stroke-dashoffset:1; }
  html.js-reveal .eng-block.in .trace,
  html.js-reveal .cnv-join.in .trace { animation:engDraw 1.6s cubic-bezier(.22,1,.36,1) forwards; }
  html:not(.js-reveal) .trace { stroke-dashoffset:0; }
  @keyframes engDraw { to { stroke-dashoffset:0; } }
  .eng-dot { opacity:0; }
  html.js-reveal .eng-block.in .eng-dot { animation:engPop .5s ease forwards; }
  html:not(.js-reveal) .eng-dot { opacity:1; }
  @keyframes engPop { from { opacity:0; transform:scale(.4);} to { opacity:1; transform:scale(1);} }

  /* Lo Shu: the birth digits drop into their cells. */
  .loshu text.cell { opacity:0; }
  html.js-reveal .eng-block.in .loshu text.cell { animation:engPop .55s ease forwards; }
  html:not(.js-reveal) .loshu text.cell { opacity:1; }

  /* The face scan sweep. */
  .scanline { opacity:0; }
  html.js-reveal .eng-block.in .scanline { animation:engScan 2.8s cubic-bezier(.5,0,.5,1) 0.5s infinite; }
  @keyframes engScan {
    0% { opacity:0; transform:translateY(0); }
    12% { opacity:1; }
    88% { opacity:1; }
    100% { opacity:0; transform:translateY(180px); }
  }

  @media (max-width:860px){
    .eng-block { grid-template-columns:1fr; gap:30px; margin-top:48px; }
    .eng-block.flip .eng-art { order:0; }
    .eng-art { min-height:0; }
  }
  @media (max-width:640px){
    .eng { padding:56px 18px 62px; }
  }

  /* ── Convergence: four readings arriving at one answer. Display type, because
        this is the closing argument of the whole page. ── */
  .cnv { border-top:1px solid var(--line); padding:80px 30px 92px; }
  .cnv-head { text-align:center; max-width:900px; margin:0 auto; }
  .cnv-head .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--tint); font-weight:800; }
  .cnv-head h2 { margin-top:14px; font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-.03em;
    font-size:clamp(38px,7.4vw,86px); line-height:.98; color:var(--fg); }
  .cnv-head h2 span { background:var(--tint-grad); -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent; }

  /* The four sources: one rounded box each, its caption underneath in the open,
     and an arrow pointing into the join. (`.cnv-src div` used to match the inner
     divs too, which is why each box had a box inside it.) */
  .cnv-src { max-width:960px; margin:52px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .cnv-item { text-align:center; }
  .cnv-item .box { border:1px solid var(--line); border-radius:16px; background:var(--card);
    padding:18px 12px; font-size:clamp(15px,1.9vw,19px); font-weight:800; letter-spacing:-.01em; }
  .cnv-item .f { margin-top:10px; font-size:clamp(12.5px,1.5vw,14.5px); line-height:1.4; color:var(--muted); }
  .cnv-item .arw { margin-top:10px; color:var(--muted); opacity:.55; font-size:15px; line-height:1; }

  /* The connectors and the hub. */
  .cnv-join { max-width:960px; margin:6px auto 0; }
  .cnv-join svg { display:block; width:100%; height:70px; overflow:visible; }
  .cnv-hub { max-width:960px; margin:0 auto; text-align:center; }
  .cnv-hub .pill { display:inline-block; border:1px solid color-mix(in srgb, var(--tint) 55%, var(--line));
    border-radius:999px; padding:13px 26px; background:color-mix(in srgb, var(--tint) 8%, transparent);
    font-size:clamp(15px,2vw,20px); font-weight:800; color:var(--fg); letter-spacing:-.01em; }

  /* The exchange. */
  .cnv-chat { max-width:760px; margin:44px auto 0; }
  .cnv-ask { text-align:right; }
  .cnv-ask span { display:inline-block; max-width:100%; background:var(--tint-grad); color:#1b1205;
    border-radius:22px 22px 6px 22px; padding:16px 22px; font-weight:700;
    font-size:clamp(19px,2.9vw,30px); line-height:1.25; letter-spacing:-.01em; }
  .cnv-ans { margin-top:20px; border:1px solid var(--line); border-radius:22px; background:var(--card); overflow:hidden; }
  .cnv-line { display:flex; gap:16px; align-items:flex-start; padding:20px 22px; }
  .cnv-line + .cnv-line { border-top:1px dashed var(--line); }
  .cnv-line .src { flex:none; width:96px; padding-top:6px; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; font-weight:800; }
  .cnv-line .txt { font-size:clamp(17px,2.4vw,25px); line-height:1.35; color:var(--fg); font-weight:500; letter-spacing:-.012em; }
  .cnv-line .txt b { font-weight:800; }
  .cnv-out { padding:22px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--tint) 5%, transparent); }
  .cnv-out .k { font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:var(--tint); }
  .cnv-out .v { margin-top:9px; font-family:'Noto Serif',Georgia,serif; font-size:clamp(21px,3.2vw,34px);
    line-height:1.25; letter-spacing:-.02em; color:var(--fg); }
  .cnv-foot { max-width:760px; margin:26px auto 0; text-align:center; font-size:clamp(13px,1.6vw,15.5px); color:var(--muted); }

  @media (max-width:760px){
    .cnv { padding:58px 18px 66px; }
    .cnv-src { grid-template-columns:repeat(2,1fr); }
    .cnv-join svg { height:60px; }
    .cnv-line { flex-direction:column; gap:6px; padding:16px 18px; }
    .cnv-line .src { width:auto; padding-top:0; }
  }

  /* ── Mobile, for everything added in this pass ── */

    function EngineShowcase(props){

        return function(){ io.disconnect(); clearTimeout(failsafe); };

        numTag:{en:'Numerology', hi:'अंक ज्योतिष'},
