<html lang="en" data-theme="celestial">

<title>AastroAstra — for the one who believes</title>

<meta property="og:title" content="AastroAstra" />
<meta property="og:description" content="One who believes in Aastroastra. Highly personalised astrology notifications, timed to the minute." />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  [data-theme="celestial"] {
    --bg:#FFFBF3; --card:#FFFFFF; --line:#EDE2CE; --fg:#2A2118; --fg2:#5A4D3E; --muted:#8A7A5E;
    --tint:#F5B642; --on-accent:#08070B;
    --grad:linear-gradient(120deg,#E5B838 0%,#F7C73E 30%,#D09224 66%,#C85822 100%);
    --title-fill:transparent; --cosmos:245,182,66;
  }
  [data-theme="light"] {
    --bg:#FFFFFF; --card:#FFFFFF; --line:#E7E7E7; --fg:#1A1A1A; --fg2:#4A4A4A; --muted:#8A8A8A;
    --tint:#E5871A; --on-accent:#08070B; --grad:none; --title-fill:#C85822; --cosmos:210,120,45;
  }
  [data-theme="dark"] {
    --bg:#0A0A0A; --card:#141414; --line:#262626; --fg:#F5F5F5; --fg2:#BFBFBF; --muted:#7A7A7A;
    --tint:#F5B642; --on-accent:#08070B;
    --grad:linear-gradient(120deg,#E5B838 0%,#F7C73E 30%,#D09224 66%,#C85822 100%);
    --title-fill:transparent; --cosmos:245,182,66;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html, body, #root { min-height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:'Inter','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    letter-spacing:-0.01em; transition:background .3s ease,color .3s ease; overflow-x:hidden;
  }
  a { color:inherit; text-decoration:none; }

  .cosmos { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:.9; }
  .frame {
    position:relative; z-index:1; width:100%; max-width:1240px; min-height:100vh; margin:0 auto;
    display:grid; grid-template-rows:auto 1fr auto;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    background:linear-gradient(to bottom, transparent, transparent);
  }

  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 28px; border-bottom:1px solid var(--line); backdrop-filter:blur(2px); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
  .mark { width:22px; height:22px; }
  .brand small { font-weight:600; color:var(--muted); letter-spacing:.16em; font-size:10px; text-transform:uppercase; }
  .controls { display:flex; align-items:center; gap:10px; }
  .seg { display:flex; gap:4px; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .seg button {
    border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:999px;
    font:inherit; font-size:12px; font-weight:600; padding:5px 11px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; transition:all .15s ease;
  }
  .seg button[aria-pressed="true"] { background:var(--tint); color:var(--on-accent); }

  .hero { display:grid; grid-template-columns:1.05fr 0.95fr; }
  .hero > div { padding:52px 28px; }
  .hero .left { border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
  .hero .right { display:flex; align-items:center; justify-content:center; }

  h1 {
    font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-0.03em;
    font-size:clamp(38px,5.4vw,74px); line-height:1.0;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:var(--title-fill);
  }
  .sub { margin-top:22px; font-size:clamp(15px,1.5vw,18px); line-height:1.55; color:var(--fg2); max-width:40ch; }
  .philo { margin-top:16px; font-size:13.5px; line-height:1.6; color:var(--muted); max-width:44ch; border-left:2px solid var(--tint); padding-left:14px; }
  .engine { margin-top:22px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
  .engine b { color:var(--tint); }

  .dl-label { margin-top:26px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .btn-play {
    margin-top:14px; display:inline-flex; align-items:center; gap:14px;
    background-color:var(--tint); background-image:var(--grad); color:var(--on-accent);
    padding:15px 22px; border-radius:12px; width:100%; max-width:330px;
    box-shadow:0 12px 30px -12px var(--tint); transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn-play:hover { transform:translateY(-1px); box-shadow:0 16px 36px -12px var(--tint); }
  .btn-play .g { width:26px; height:26px; flex:none; }
  .btn-play .t small { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.75; }
  .btn-play .t b { display:block; font-size:18px; font-weight:700; }
  .meta { margin-top:12px; font-size:13px; color:var(--muted); }
  .meta b { color:var(--fg); font-weight:600; }
  .apk-direct { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .apk-direct a { color:var(--fg2); border-bottom:1px solid var(--line); }
  .apk-direct a:hover { color:var(--tint); border-color:var(--tint); }

  /* ── Phone ── */
  .phone {
    position:relative; width:300px; height:600px; border-radius:42px; padding:12px;
    background:linear-gradient(160deg,#26262b,#0d0d10); box-shadow:0 40px 90px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .screen { position:relative; width:100%; height:100%; border-radius:32px; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #241a10 0%, #0c0a08 55%, #050505 100%); color:#fff; }
  .notch { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:110px; height:26px; background:#000; border-radius:0 0 16px 16px; z-index:3; }
  .lock { padding:44px 18px 10px; text-align:center; }
  .lock .clk { font-family:'Noto Serif',serif; font-size:52px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .lock .dt { margin-top:4px; font-size:12.5px; color:rgba(255,255,255,.6); }
  .stack { position:absolute; left:12px; right:12px; bottom:16px; display:flex; flex-direction:column; gap:9px; }
  .ncard {
    background:rgba(30,28,26,.72); backdrop-filter:blur(14px); border:1px solid rgba(245,182,66,.16);
    border-radius:18px; padding:12px 13px; box-shadow:0 8px 22px -12px rgba(0,0,0,.7);
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .ncard.fresh { border-color:rgba(245,182,66,.42); box-shadow:0 12px 30px -12px rgba(245,182,66,.35); }
  .nrow { display:flex; align-items:center; gap:7px; font-size:11px; color:rgba(255,255,255,.6); }
  .nicon { width:16px; height:16px; border-radius:5px; background:linear-gradient(140deg,#F7C73E,#C85822); color:#000; display:inline-flex; align-items:center; justify-content:center; font-size:10px; }
  .napp { color:#fff; font-weight:600; }
  .ncad { margin-left:auto; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:999px; }
  .cad-transit { background:rgba(245,182,66,.18); color:#F7C73E; }
  .cad-weekly { background:rgba(120,170,255,.16); color:#8FB4FF; }
  .cad-monthly { background:rgba(180,130,255,.16); color:#C6A2FF; }
  .ntitle { margin-top:7px; font-size:13.5px; font-weight:700; color:#fff; }
  .nbody { margin-top:3px; font-size:12.5px; line-height:1.45; color:rgba(255,255,255,.82); }
  .nfor { margin-top:7px; font-size:10.5px; color:rgba(245,182,66,.75); }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }

  footer { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); }
  footer > * { padding:18px 28px; font-size:13px; color:var(--muted); }
  footer > *:not(:last-child) { border-right:1px solid var(--line); }
  footer a:hover { color:var(--tint); }
  .tm { text-align:right; }

  @media (max-width:860px) {
    .hero { grid-template-columns:1fr; }
    .hero .left { border-right:none; border-bottom:1px solid var(--line); }
    .hero > div { padding:40px 22px; }
    .hero .right { padding-top:8px; }
    footer { grid-template-columns:1fr; }
    footer > *:not(:last-child) { border-right:none; border-bottom:1px solid var(--line); }
    .tm { text-align:left; }
    header { flex-wrap:wrap; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script>

      { cad:'weekly',  en:{t:'Career · money talks land', b:'Jupiter aspects your 2nd house — a conversation about money goes well Thu–Fri.'},
        hi:{t:'करियर · धन की बात बनेगी', b:'गुरु की दृष्टि आपके द्वितीय भाव पर — बुध–शुक्रवार पैसे की बात अच्छी रहेगी।'} },

    // ── Cosmic canvas: stars + 13 planets on orbits exchanging signals, evolving with time ──
    function Cosmos(props) {
      var ref = useRef(null);
      useEffect(function () {
        var canvas = ref.current, ctx = canvas.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, Hh = 0, raf;
        function resize(){ W = window.innerWidth; Hh = window.innerHeight; canvas.width = W*dpr; canvas.height = Hh*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
        resize(); window.addEventListener('resize', resize);
        var stars = []; for (var i=0;i<120;i++) stars.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.3, tw:Math.random()*6.28, sp:Math.random()*0.5+0.1 });
        var N = 13, planets = []; for (var j=0;j<N;j++) planets.push({ base:Math.random()*6.28, rad:0.10+(j/N)*0.34, speed:(0.015+Math.random()*0.05)*(j%2?1:-1), sz:1.4+Math.random()*2.6 });
        function tint(){ var v = getComputedStyle(document.documentElement).getPropertyValue('--cosmos').trim() || '245,182,66'; return v.split(',').map(Number); }
        function frame(ts){
          var t = ts/1000, c = tint(), r=c[0], g=c[1], b=c[2];
          ctx.clearRect(0,0,W,Hh);
          var cx = W>860 ? W*0.66 : W*0.5, cy = Hh*0.5, R = Math.min(W,Hh);
          for (var s=0;s<stars.length;s++){ var st=stars[s], a=0.28+0.34*Math.sin(t*st.sp+st.tw); ctx.fillStyle='rgba('+r+','+g+','+b+','+(a*0.55)+')'; ctx.beginPath(); ctx.arc(st.x*W, st.y*Hh, st.r, 0, 6.28); ctx.fill(); }
          var pts = []; for (var p=0;p<planets.length;p++){ var pl=planets[p], ang=pl.base+t*pl.speed; pts.push({ x:cx+Math.cos(ang)*pl.rad*R, y:cy+Math.sin(ang)*pl.rad*R*0.72, sz:pl.sz }); }
          var maxD = R*0.26;
          for (var m=0;m<pts.length;m++) for (var n=m+1;n<pts.length;n++){
            var dx=pts[m].x-pts[n].x, dy=pts[m].y-pts[n].y, d=Math.hypot(dx,dy);
            if (d<maxD){ var al=(1-d/maxD)*0.16; ctx.strokeStyle='rgba('+r+','+g+','+b+','+al+')'; ctx.lineWidth=0.6; ctx.beginPath(); ctx.moveTo(pts[m].x,pts[m].y); ctx.lineTo(pts[n].x,pts[n].y); ctx.stroke();
              var u=(t*0.28+m*0.13)%1, sx=pts[m].x+(pts[n].x-pts[m].x)*u, sy=pts[m].y+(pts[n].y-pts[m].y)*u; ctx.fillStyle='rgba('+r+','+g+','+b+','+(al*2.6)+')'; ctx.beginPath(); ctx.arc(sx,sy,1.1,0,6.28); ctx.fill(); }
          }
          for (var q=0;q<pts.length;q++){ var pt=pts[q];

          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return function(){ cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
      }, [props.theme]);
      return h('canvas', { ref: ref, className: 'cosmos' });
    }

        applyTheme(saved);
        try { var lg = localStorage.getItem('aa-lang'); if (lg) setLang(lg); } catch(e){}
        fetch(SUPA+'version.json?t='+Date.now(), { cache:'no-store' }).then(function(r){ return r.ok?r.json():null; }).then(function(v){
          if (v) setVer({ ver:v.version||'0.2.1', size:v.sizeMb||'5.8', apk:v.apk||(SUPA+'aastroastra-latest.apk') });
        }).catch(function(){});
      }, []);

      function applyTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        var meta = { celestial:'#FFFBF3', light:'#FFFFFF', dark:'#0A0A0A' };
        var mt = document.querySelector('meta[name=theme-color]'); if (mt && meta[t]) mt.content = meta[t];
        setTheme(t); try { localStorage.setItem('aa-theme', t); } catch(e){}
      }
      function pickLang(l){ setLang(l); try { localStorage.setItem('aa-lang', l); } catch(e){} }

      var themeBtns = [['celestial','✦'],['light','☀'],['dark','☾']].map(function(x){
        return h('button', { key:x[0], title:x[0], 'aria-pressed': theme===x[0], onClick:function(){ applyTheme(x[0]); } }, x[1]);
      });
      var langBtns = [['en','EN'],['hi','हिं']].map(function(x){
        return h('button', { key:x[0], 'aria-pressed': lang===x[0], onClick:function(){ pickLang(x[0]); } }, x[1]);
      });

      return h(React.Fragment, null,
        h(Cosmos, { theme: theme }),
        h('main', { className:'frame' },
          h('header', null,
            h('div', { className:'brand' },
              h('svg', { className:'mark', viewBox:'0 0 24 24', 'aria-hidden':'true' },
                h('path', { d:'M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6L12 0z', fill:'var(--tint)' })),
              h('span', null, 'AastroAstra'),
              h('small', null, 'Beta')
            ),
            h('div', { className:'controls' },
              h('div', { className:'seg', role:'group', 'aria-label':'Language' }, langBtns),
              h('div', { className:'seg', role:'group', 'aria-label':'Theme' }, themeBtns)
            )
          ),
          h('section', { className:'hero' },
            h('div', { className:'left' },
              h('h1', null, 'One who believes', h('br'), 'in Aastroastra.'),
              h('p', { className:'sub' }, COPY.sub[lang]),
              h('p', { className:'philo' }, COPY.philo[lang]),
              h('div', { className:'engine' }, h('b', null, '✦'), COPY.engine[lang]),
              h('div', { className:'dl-label' }, COPY.dl[lang]),
              h('a', { className:'btn-play', href:ver.apk, rel:'noopener' },
                h('svg', { className:'g', viewBox:'0 0 512 512', 'aria-hidden':'true' },
                  h('path', { d:'M47 32c-9 5-15 15-15 28v392c0 13 6 23 15 28l224-224L47 32z', fill:'currentColor' }),
                  h('path', { d:'M336 176L83 33c-9-5-18-5-25-1l224 224 54-80z', fill:'currentColor', opacity:'0.82' }),
                  h('path', { d:'M336 336l-54-80-224 224c7 4 16 4 25-1l253-143z', fill:'currentColor', opacity:'0.82' }),
                  h('path', { d:'M336 176l-54 80 54 80 94-53c17-10 17-44 0-54l-94-53z', fill:'currentColor', opacity:'0.6' })
                ),
                h('div', { className:'t' }, h('small', null, COPY.getapp[lang]), h('b', null, COPY.download[lang]))
              ),
              h('div', { className:'meta' }, 'Version ', h('b', null, ver.ver), ' · Android APK · ', ver.size, ' MB'),
              h('div', { className:'apk-direct' }, 'Direct link: ', h('a', { href:ver.apk }, 'aastroastra-latest.apk'))
            ),
            h('div', { className:'right' }, h(Phone, { lang: lang }))
          ),
          h('footer', null,
            h('a', { href:'./privacy.html' }, COPY.privacy[lang]),
            h('a', { href:'./terms.html' }, COPY.terms[lang]),
            h('div', { className:'tm' }, 'AastroAstra™ · © ' + (new Date().getFullYear()))
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  })();
  </script>
