  .themes button { border:1.5px solid transparent; background:transparent; border-radius:999px; width:30px; height:30px; padding:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:border-color .15s ease; }

  .center { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; padding:8px 12px 16px; }

  .ncard::after { top:-13px; left:22px; right:22px; opacity:.6; }

  .nicon { width:18px; height:18px; border-radius:6px; background:var(--pa); color:#111; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .napp { color:#fff; font-weight:600; }
  .ncad { margin-left:auto; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:rgba(245,185,58,.2); color:var(--pa); }
  .ntitle { margin-top:10px; font-size:17px; font-weight:700; color:#fff; }
  .nbody { margin-top:4px; font-size:14.5px; line-height:1.42; color:rgba(255,255,255,.88); }
  .nfor { margin-top:9px; font-size:11px; color:var(--pa); }

  .airow { margin-top:12px; display:flex; }
  .aibtn { position:relative; display:inline-flex; align-items:center; gap:7px; background:var(--pa); color:#111; border:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px; }
  .aibtn .st { font-size:12px; }
  .aibtn.invite::after { content:""; position:absolute; inset:-5px; border-radius:999px; border:2px solid var(--pa); animation:ring 1.7s ease-out infinite; }
  @keyframes ring { 0%{ transform:scale(.92); opacity:.7; } 100%{ transform:scale(1.55); opacity:0; } }

  .aireply { margin-top:12px; display:flex; gap:9px; animation:fade .35s ease both; }
  .aiav { flex:none; width:24px; height:24px; border-radius:50%; background:var(--pa); color:#111; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
  .aibubble { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); border-radius:6px 16px 16px 16px; padding:10px 13px; }
  .aibubble .who { font-size:11px; font-weight:700; color:var(--pa); letter-spacing:.02em; }
  .aibubble .msg { margin-top:3px; font-size:13.5px; line-height:1.45; color:rgba(255,255,255,.92); }
  @keyframes fade { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  [data-theme^="mono"] .ncard { border-color:rgba(255,255,255,.16); }

  footer { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); }
  footer > * { padding:16px 30px; font-size:13px; color:var(--muted); }
  footer > *:not(:last-child) { border-right:1px solid var(--line); }
  footer a:hover { color:var(--tint); }
  .tm { text-align:right; }

  @media (max-width:900px) {
    html, body, #root { height:auto; } body { overflow:auto; }
    .frame { height:auto; min-height:100vh; }
    .hero { grid-template-columns:1fr; }
    .hero .left { border-right:none; border-bottom:1px solid var(--line); }
    .hero > div { padding:34px 20px; }
    .hero .right { padding:24px 20px 44px; }
    .phone { height:600px; }
    footer { grid-template-columns:1fr; }
    footer > *:not(:last-child) { border-right:none; border-bottom:1px solid var(--line); }
    .tm { text-align:left; }
  }
  @media (max-width:560px) {
    header { flex-wrap:wrap; row-gap:12px; padding:16px 18px; }
    .brand { flex:1 1 auto; } .controls { width:100%; justify-content:space-between; }
    .hero > div { padding:30px 18px; } h1 { font-size:clamp(40px,13vw,72px); }
  }
</style>

    var THEMES = [ ['yellow-light','cl','#E0A015','Yellow · Light'], ['mono-light','cl','#111111','B&W · Light'], ['yellow-dark','cd','#F5B93A','Yellow · Dark'], ['mono-dark','cd','#FFFFFF','B&W · Dark'] ];
    var META = { 'yellow-light':'#FFFFFF','mono-light':'#FFFFFF','yellow-dark':'#0B0B0C','mono-dark':'#0A0A0A' };

    function App(){
      var tS=useState('yellow-light'), theme=tS[0], setTheme=tS[1];
      var lS=useState('en'), lang=lS[0], setLang=lS[1];
      var vS=useState({ver:'0.2.1',size:'5.8',apk:SUPA+'aastroastra-latest.apk',updated:''}), ver=vS[0], setVer=vS[1];
      useEffect(function(){
        var saved; try{ saved=localStorage.getItem('aa-theme'); }catch(e){}
        if(!META[saved]) saved=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'yellow-dark':'yellow-light';
        applyTheme(saved);
        try{ var lg=localStorage.getItem('aa-lang'); if(lg) setLang(lg); }catch(e){}
        fetch(SUPA+'version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(v){ if(v) setVer({ver:v.version||'0.2.1',size:v.sizeMb||'5.8',apk:v.apk||(SUPA+'aastroastra-latest.apk'),updated:v.updated||v.date||''}); }).catch(function(){});
      }, []);
      function applyTheme(t){ if(!META[t]) t='yellow-light'; document.documentElement.setAttribute('data-theme',t); var mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=META[t]; setTheme(t); try{ localStorage.setItem('aa-theme',t); }catch(e){} }
      function pickLang(l){ setLang(l); try{ localStorage.setItem('aa-lang',l); }catch(e){} }

      var themeBtns=THEMES.map(function(x){ return h('button',{key:x[0],title:x[3],'aria-pressed':theme===x[0],onClick:function(){applyTheme(x[0]);}}, h('span',{className:'chip '+x[1]}, h('i',{style:{background:x[2]}}))); });
      var langBtns=[['en','EN'],['hi','हिं']].map(function(x){ return h('button',{key:x[0],'aria-pressed':lang===x[0],onClick:function(){pickLang(x[0]);}},x[1]); });

      return h(React.Fragment, null,
        h(Cosmos, { theme:theme }),
        h('main', { className:'frame' },
          h('header', null,
            h('div', { className:'brand' },
              h('svg', { className:'mark', viewBox:'0 0 24 24','aria-hidden':'true' }, h('path',{d:'M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6L12 0z',fill:'var(--tint)'})),
              h('span', null, 'AastroAstra'), h('small', null, 'Beta')
            ),
            h('div', { className:'controls' },
              h('div', { className:'seg', role:'group','aria-label':'Language' }, langBtns),
              h('div', { className:'themes', role:'group','aria-label':'Theme' }, themeBtns)
            )
          ),
          h('section', { className:'hero' },
            h('div', { className:'left' },
              h('h1', null, 'One who', h('br'), 'believes'),
              h('div', { className:'dl-label' }, COPY.dl[lang]),
              h('a', { className:'btn-play', href:ver.apk, rel:'noopener' },
                h('svg',{className:'g',viewBox:'0 0 512 512','aria-hidden':'true'},
                  h('path',{d:'M47 32c-9 5-15 15-15 28v392c0 13 6 23 15 28l224-224L47 32z',fill:'currentColor'}),
                  h('path',{d:'M336 176L83 33c-9-5-18-5-25-1l224 224 54-80z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 336l-54-80-224 224c7 4 16 4 25-1l253-143z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 176l-54 80 54 80 94-53c17-10 17-44 0-54l-94-53z',fill:'currentColor',opacity:'0.6'})),
                h('div',{className:'t'}, h('small',null,COPY.getapp[lang]), h('b',null,COPY.download[lang]))
              ),
              h('div', { className:'meta' }, 'Version ', h('b',null,ver.ver), ' · Android APK · ', ver.size, ' MB'),
              ver.updated ? h('div', { className:'meta' }, (lang==='hi'?'अंतिम अपडेट: ':'Last updated: '), h('b',null,ver.updated)) : null,
              h('div', { className:'apk-direct' }, 'Direct link: ', h('a',{href:ver.apk},'aastroastra-latest.apk'))
            ),
            h('div', { className:'right' }, h(Phone, { lang:lang }))
          ),
          h('footer', null,
            h('a', { href:'./privacy.html' }, COPY.privacy[lang]),
            h('a', { href:'./terms.html' }, COPY.terms[lang]),
            h('div', { className:'tm' }, 'AastroAstra™ · © ' + (new Date().getFullYear()))
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  })();
  </script>
