<!DOCTYPE html>
<html lang="en" data-theme="celestial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AastroAstra · for the one who believes</title>
<meta name="description" content="AastroAstra · highly personalised astrology notifications, timed to the minute. Download the Android beta." />
<meta name="theme-color" content="#FFFFFF" />
<meta property="og:title" content="AastroAstra" />
<meta property="og:description" content="One who believes. Personalised astrology notifications for Android." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Solid palettes - white bg + celestial-orange accent (Android app reference) */
  [data-theme="celestial"] { --bg:#FFFFFF; --card:#FFFFFF; --line:#EDE6DA; --fg:#1A1A1A; --fg2:#57493B; --muted:#9A8E7C; --tint:#C85822; --on-accent:#FFFFFF; --cosmos:200,108,42; }
  [data-theme="light"]     { --bg:#FFFFFF; --card:#FFFFFF; --line:#ECECEC; --fg:#1A1A1A; --fg2:#4E4E4E; --muted:#8C8C8C; --tint:#C85822; --on-accent:#FFFFFF; --cosmos:200,108,42; }
  [data-theme="dark"]      { --bg:#0B0B0C; --card:#151515; --line:#242424; --fg:#F4F4F4; --fg2:#BDBDBD; --muted:#7C7C7C; --tint:#E0781F; --on-accent:#0B0B0C; --cosmos:224,140,60; }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html, body, #root { height:100%; max-width:100%; }
  body {
    background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:'Inter','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    letter-spacing:-0.01em; transition:background .3s ease,color .3s ease;
  }
  a { color:inherit; text-decoration:none; }

  .cosmos { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.85; }
  .frame {
    position:relative; z-index:1; width:100%; max-width:1240px; height:100vh; margin:0 auto;
    display:grid; grid-template-rows:auto 1fr auto;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }

  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 30px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
  .mark { width:22px; height:22px; }
  .brand small { font-weight:600; color:var(--muted); letter-spacing:.16em; font-size:10px; text-transform:uppercase; }
  .controls { display:flex; align-items:center; gap:10px; }
  .seg { display:flex; gap:4px; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .seg button { border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:999px; font:inherit; font-size:12px; font-weight:600; padding:5px 11px; min-width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; transition:all .15s ease; }
  .seg button[aria-pressed="true"] { background:var(--tint); color:var(--on-accent); }

  .hero { display:grid; grid-template-columns:1fr 0.9fr; min-height:0; }
  .hero > div { padding:30px 30px; min-height:0; }
  .hero .left { border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
  .hero .right { display:flex; align-items:center; justify-content:center; }

  h1 { font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-0.03em; font-size:clamp(46px,7vw,104px); line-height:0.98; color:var(--tint); }
  .dl-label { margin-top:36px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .btn-play { margin-top:14px; display:inline-flex; align-items:center; gap:14px; background:var(--tint); color:var(--on-accent); padding:16px 24px; border-radius:12px; width:100%; max-width:340px; transition:transform .15s ease, filter .15s ease; }
  .btn-play:hover { transform:translateY(-1px); filter:brightness(1.05); }
  .btn-play .g { width:26px; height:26px; flex:none; }
  .btn-play .t small { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  .btn-play .t b { display:block; font-size:19px; font-weight:700; }
  .meta { margin-top:14px; font-size:13px; color:var(--muted); }
  .meta b { color:var(--fg); font-weight:600; }
  .apk-direct { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .apk-direct a { color:var(--fg2); border-bottom:1px solid var(--line); }
  .apk-direct a:hover { color:var(--tint); border-color:var(--tint); }

  /* ── Phone ── */
  .phone { position:relative; width:300px; height:min(600px, calc(100vh - 150px)); border-radius:44px; padding:11px; background:#0c0c0f; box-shadow:0 40px 90px -34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05) inset; transition:transform .35s cubic-bezier(.2,.7,.2,1); }
  .phone:hover { transform:translateY(-6px) rotate(-.6deg); }
  .screen { position:relative; width:100%; height:100%; border-radius:34px; overflow:hidden; background:#0b0906; color:#fff; display:flex; flex-direction:column; }
  .notch { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:112px; height:26px; background:#000; border-radius:0 0 16px 16px; z-index:3; }
  .lock { flex:none; padding:40px 18px 14px; text-align:center; }
  .lock .clk { font-family:'Noto Serif',serif; font-size:58px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .lock .dt { margin-top:5px; font-size:13px; color:rgba(255,255,255,.6); }
  .feed { flex:1; min-height:0; overflow-y:auto; padding:2px 12px 16px; display:flex; flex-direction:column; gap:11px; scrollbar-width:none; -ms-overflow-style:none; scroll-behavior:auto; }
  .feed::-webkit-scrollbar { display:none; }
  .ncard { flex:none; background:rgba(26,24,22,.82); backdrop-filter:blur(12px); border:1px solid rgba(224,120,45,.20); border-radius:20px; padding:14px 15px; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .ncard:hover { transform:scale(1.025); border-color:rgba(224,120,45,.6); box-shadow:0 14px 32px -14px rgba(224,120,45,.5); }
  .nrow { display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.62); }
  .nicon { width:18px; height:18px; border-radius:6px; background:#E0781F; color:#0b0b0c; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .napp { color:#fff; font-weight:600; }
  .ncad { margin-left:auto; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
  .cad-transit { background:rgba(224,120,45,.20); color:#F2A25A; }
  .cad-weekly  { background:rgba(120,170,255,.18); color:#8FB4FF; }
  .cad-monthly { background:rgba(180,130,255,.18); color:#C6A2FF; }
  .ntitle { margin-top:9px; font-size:16px; font-weight:700; color:#fff; }
  .nbody { margin-top:4px; font-size:14px; line-height:1.4; color:rgba(255,255,255,.86); }
  .nfor { margin-top:9px; font-size:11px; color:rgba(224,120,45,.85); }

  footer { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); }
  footer > * { padding:16px 30px; font-size:13px; color:var(--muted); }
  footer > *:not(:last-child) { border-right:1px solid var(--line); }
  footer a:hover { color:var(--tint); }
  .tm { text-align:right; }

  @media (max-width:900px) {
    html, body, #root { height:auto; }
    body { overflow:auto; }
    .frame { height:auto; min-height:100vh; }
    .hero { grid-template-columns:1fr; }
    .hero .left { border-right:none; border-bottom:1px solid var(--line); }
    .hero > div { padding:34px 20px; }
    .hero .right { padding:22px 20px 40px; }
    .phone { height:560px; }
    footer { grid-template-columns:1fr; }
    footer > *:not(:last-child) { border-right:none; border-bottom:1px solid var(--line); }
    .tm { text-align:left; }
  }
  @media (max-width:560px) {
    header { flex-wrap:wrap; row-gap:12px; padding:16px 18px; }
    .brand { flex:1 1 auto; }
    .controls { width:100%; justify-content:space-between; }
    .hero > div { padding:30px 18px; }
    h1 { font-size:clamp(40px,13vw,72px); }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
  (function () {
    var h = React.createElement;
    var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;
    var SUPA = 'https://gttszlununmqivrqevwv.supabase.co/storage/v1/object/public/site/';

    var CAD = { transit:{en:'Transit',hi:'गोचर'}, weekly:{en:'Weekly',hi:'साप्ताहिक'}, monthly:{en:'Monthly',hi:'मासिक'} };
    // Concise, precise. transit / weekly / monthly × career / health / love.
    var NOTIFS = [
      { cad:'transit', en:{t:'Career', b:'Moon in your 10th at 4:12 PM. Pitch now.'}, hi:{t:'करियर', b:'शाम 4:12 बजे दशम भाव में चंद्र। अभी विचार रखें।'} },
      { cad:'weekly',  en:{t:'Health', b:'Mars trines your Ascendant. Energy peaks Wed & Thu.'}, hi:{t:'स्वास्थ्य', b:'मंगल का त्रिकोण। बुध व गुरुवार ऊर्जा चरम पर।'} },
      { cad:'monthly', en:{t:'Love', b:'Venus lights your 7th. The 14th to 18th favour love.'}, hi:{t:'प्रेम', b:'सप्तम में शुक्र। 14 से 18 प्रेम को शुभ।'} },
      { cad:'transit', en:{t:'Health', b:'Saturn squares your Moon tonight. Rest by 9 PM.'}, hi:{t:'स्वास्थ्य', b:'आज रात शनि की दृष्टि। 9 बजे तक आराम करें।'} },
      { cad:'weekly',  en:{t:'Career', b:'Jupiter aspects your 2nd. Money talks land Thursday.'}, hi:{t:'करियर', b:'गुरु की दृष्टि द्वितीय पर। गुरुवार धन की बात बनेगी।'} },
      { cad:'monthly', en:{t:'Career', b:'Your Sun dasha turns active. Recognition after the 21st.'}, hi:{t:'करियर', b:'सूर्य दशा सक्रिय। 21 के बाद पहचान बढ़ेगी।'} },
      { cad:'transit', en:{t:'Love', b:'Moon meets Venus at 9 PM. A warm window for love.'}, hi:{t:'प्रेम', b:'रात 9 बजे चंद्र और शुक्र। प्रेम का सुंदर समय।'} },
      { cad:'weekly',  en:{t:'Love', b:'Mercury softens your words. Clear the air on the 12th.'}, hi:{t:'प्रेम', b:'बुध वाणी मीठी करेगा। 12 को बात सुलझाएँ।'} },
      { cad:'monthly', en:{t:'Health', b:'Sade Sati eases. Vitality returns after the 9th.'}, hi:{t:'स्वास्थ्य', b:'साढ़े साती नरम। 9 के बाद ऊर्जा लौटेगी।'} },
    ];

    function Cosmos(props){
      var ref = useRef(null);
      useEffect(function(){
        var canvas = ref.current, ctx = canvas.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio||1,2), W=0, Hh=0, raf;
        function resize(){ W=window.innerWidth; Hh=window.innerHeight; canvas.width=W*dpr; canvas.height=Hh*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
        resize(); window.addEventListener('resize', resize);
        var stars=[]; for(var i=0;i<110;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.3,tw:Math.random()*6.28,sp:Math.random()*0.5+0.1});
        var N=13, planets=[]; for(var j=0;j<N;j++) planets.push({base:Math.random()*6.28,rad:0.10+(j/N)*0.34,speed:(0.014+Math.random()*0.045)*(j%2?1:-1),sz:1.4+Math.random()*2.4});
        function col(){ var v=getComputedStyle(document.documentElement).getPropertyValue('--cosmos').trim()||'200,108,42'; return v.split(',').map(Number); }
        function frame(ts){
          var t=ts/1000, c=col(), r=c[0], g=c[1], b=c[2];
          ctx.clearRect(0,0,W,Hh);
          var cx=W>900?W*0.68:W*0.5, cy=Hh*0.5, R=Math.min(W,Hh);
          for(var s=0;s<stars.length;s++){ var st=stars[s], a=0.22+0.30*Math.sin(t*st.sp+st.tw); ctx.fillStyle='rgba('+r+','+g+','+b+','+(a*0.5)+')'; ctx.beginPath(); ctx.arc(st.x*W,st.y*Hh,st.r,0,6.28); ctx.fill(); }
          var pts=[]; for(var p=0;p<planets.length;p++){ var pl=planets[p], ang=pl.base+t*pl.speed; pts.push({x:cx+Math.cos(ang)*pl.rad*R, y:cy+Math.sin(ang)*pl.rad*R*0.72, sz:pl.sz}); }
          var maxD=R*0.24;
          for(var m=0;m<pts.length;m++) for(var n=m+1;n<pts.length;n++){ var dx=pts[m].x-pts[n].x, dy=pts[m].y-pts[n].y, d=Math.hypot(dx,dy);
            if(d<maxD){ var al=(1-d/maxD)*0.14; ctx.strokeStyle='rgba('+r+','+g+','+b+','+al+')'; ctx.lineWidth=0.6; ctx.beginPath(); ctx.moveTo(pts[m].x,pts[m].y); ctx.lineTo(pts[n].x,pts[n].y); ctx.stroke();
              var u=(t*0.26+m*0.13)%1, sx=pts[m].x+(pts[n].x-pts[m].x)*u, sy=pts[m].y+(pts[n].y-pts[m].y)*u; ctx.fillStyle='rgba('+r+','+g+','+b+','+(al*2.6)+')'; ctx.beginPath(); ctx.arc(sx,sy,1.1,0,6.28); ctx.fill(); } }
          for(var q=0;q<pts.length;q++){ ctx.fillStyle='rgba('+r+','+g+','+b+',0.85)'; ctx.beginPath(); ctx.arc(pts[q].x,pts[q].y,pts[q].sz,0,6.28); ctx.fill(); }
          raf=requestAnimationFrame(frame);
        }
        raf=requestAnimationFrame(frame);
        return function(){ cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
      }, [props.theme]);
      return h('canvas', { ref:ref, className:'cosmos' });
    }

    function NotifCard(props){
      var n=props.n, lang=props.lang, c=n[lang];
      return h('div', { className:'ncard' },
        h('div', { className:'nrow' },
          h('span', { className:'nicon' }, '✦'),
          h('span', { className:'napp' }, 'AastroAstra'),
          h('span', null, '·'),
          h('span', null, lang==='hi'?'अभी':'now'),
          h('span', { className:'ncad cad-'+n.cad }, CAD[n.cad][lang])
        ),
        h('div', { className:'ntitle' }, c.t),
        h('div', { className:'nbody' }, c.b),
        h('div', { className:'nfor' }, lang==='hi'?'राहुल के लिए · कर्क चंद्र · मूलांक 4':'for Rahul · Cancer Moon · Driver 4')
      );
    }

    function Phone(props){
      var lang=props.lang, feedRef=useRef(null);
      useEffect(function(){
        var el=feedRef.current; if(!el) return; var raf, paused=false;
        function enter(){ paused=true; } function leave(){ paused=false; }
        el.addEventListener('mouseenter', enter); el.addEventListener('mouseleave', leave);
        function step(){ if(!paused && el.scrollHeight>el.clientHeight){ el.scrollTop+=0.42; var half=el.scrollHeight/2; if(el.scrollTop>=half) el.scrollTop-=half; } raf=requestAnimationFrame(step); }
        raf=requestAnimationFrame(step);
        return function(){ cancelAnimationFrame(raf); el.removeEventListener('mouseenter',enter); el.removeEventListener('mouseleave',leave); };
      }, []);
      var loop = NOTIFS.concat(NOTIFS);
      return h('div', { className:'phone' },
        h('div', { className:'notch' }),
        h('div', { className:'screen' },
          h('div', { className:'lock' },
            h('div', { className:'clk' }, '9:41'),
            h('div', { className:'dt' }, lang==='hi'?'सोमवार, 20 जुलाई':'Monday, 20 July')
          ),
          h('div', { className:'feed', ref:feedRef },
            loop.map(function(n,k){ return h(NotifCard, { key:k, n:n, lang:lang }); })
          )
        )
      );
    }

    var COPY = {
      dl:{en:'Download the beta',hi:'बीटा डाउनलोड करें'},
      getapp:{en:'Get the Android app',hi:'एंड्रॉइड ऐप लें'},
      download:{en:'Download Beta',hi:'बीटा डाउनलोड'},
      privacy:{en:'Privacy Policy',hi:'गोपनीयता नीति'},
      terms:{en:'Terms of Use',hi:'उपयोग की शर्तें'},
    };

    function App(){
      var themeS=useState('celestial'), theme=themeS[0], setTheme=themeS[1];
      var langS=useState('en'), lang=langS[0], setLang=langS[1];
      var verS=useState({ver:'0.2.1',size:'5.8',apk:SUPA+'aastroastra-latest.apk'}), ver=verS[0], setVer=verS[1];

      useEffect(function(){
        var saved; try{ saved=localStorage.getItem('aa-theme'); }catch(e){}
        if(!saved) saved=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'celestial';
        applyTheme(saved);
        try{ var lg=localStorage.getItem('aa-lang'); if(lg) setLang(lg); }catch(e){}
        fetch(SUPA+'version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(v){ if(v) setVer({ver:v.version||'0.2.1',size:v.sizeMb||'5.8',apk:v.apk||(SUPA+'aastroastra-latest.apk')}); }).catch(function(){});
      }, []);

      function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); var meta={celestial:'#FFFFFF',light:'#FFFFFF',dark:'#0B0B0C'}; var mt=document.querySelector('meta[name=theme-color]'); if(mt&&meta[t]) mt.content=meta[t]; setTheme(t); try{ localStorage.setItem('aa-theme',t); }catch(e){} }
      function pickLang(l){ setLang(l); try{ localStorage.setItem('aa-lang',l); }catch(e){} }

      var themeBtns=[['celestial','✦'],['light','☀'],['dark','☾']].map(function(x){ return h('button',{key:x[0],title:x[0],'aria-pressed':theme===x[0],onClick:function(){applyTheme(x[0]);}},x[1]); });
      var langBtns=[['en','EN'],['hi','हिं']].map(function(x){ return h('button',{key:x[0],'aria-pressed':lang===x[0],onClick:function(){pickLang(x[0]);}},x[1]); });

      return h(React.Fragment, null,
        h(Cosmos, { theme:theme }),
        h('main', { className:'frame' },
          h('header', null,
            h('div', { className:'brand' },
              h('svg', { className:'mark', viewBox:'0 0 24 24','aria-hidden':'true' }, h('path',{d:'M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6L12 0z',fill:'var(--tint)'})),
              h('span', null, 'AastroAstra'),
              h('small', null, 'Beta')
            ),
            h('div', { className:'controls' },
              h('div', { className:'seg', role:'group','aria-label':'Language' }, langBtns),
              h('div', { className:'seg', role:'group','aria-label':'Theme' }, themeBtns)
            )
          ),
          h('section', { className:'hero' },
            h('div', { className:'left' },
              h('h1', null, 'One who', h('br'), 'believes'),
              h('div', { className:'dl-label' }, COPY.dl[lang]),
              h('a', { className:'btn-play', href:ver.apk, rel:'noopener' },
                h('svg',{className:'g',viewBox:'0 0 512 512','aria-hidden':'true'},
                  h('path',{d:'M47 32c-9 5-15 15-15 28v392c0 13 6 23 15 28l224-224L47 32z',fill:'currentColor'}),
                  h('path',{d:'M336 176L83 33c-9-5-18-5-25-1l224 224 54-80z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 336l-54-80-224 224c7 4 16 4 25-1l253-143z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 176l-54 80 54 80 94-53c17-10 17-44 0-54l-94-53z',fill:'currentColor',opacity:'0.6'})),
                h('div',{className:'t'}, h('small',null,COPY.getapp[lang]), h('b',null,COPY.download[lang]))
              ),
              h('div', { className:'meta' }, 'Version ', h('b',null,ver.ver), ' · Android APK · ', ver.size, ' MB'),
              h('div', { className:'apk-direct' }, 'Direct link: ', h('a',{href:ver.apk},'aastroastra-latest.apk'))
            ),
            h('div', { className:'right' }, h(Phone, { lang:lang }))
          ),
          h('footer', null,
            h('a', { href:'./privacy.html' }, COPY.privacy[lang]),
            h('a', { href:'./terms.html' }, COPY.terms[lang]),
            h('div', { className:'tm' }, 'AastroAstra™ · © ' + (new Date().getFullYear()))
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  })();
  </script>
</body>
</html>
