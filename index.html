<!DOCTYPE html>
<html lang="en" data-theme="yellow-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AastroAstra · for the one who believes</title>
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="description" content="AastroAstra · highly personalised astrology notifications with an AI you can ask. Download the Android beta." />
<meta name="theme-color" content="#FFFFFF" />
<meta property="og:title" content="AastroAstra" />
<meta property="og:description" content="One who believes. Personalised astrology notifications for Android." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Four solid themes: Yellow / B&W  ×  Light / Dark (inverts). No gradients. */
  [data-theme="yellow-light"] { --bg:#FFFFFF; --card:#FFFFFF; --line:#ECE6D8; --fg:#1A1A1A; --fg2:#565043; --muted:#8C8676; --tint:#E0A015; --on-accent:#1A1A1A; --cosmos:55,55,55; --pa:#F5B93A; --btn-bg:#0B0B0C; --btn-fg:#FFFFFF; }
  [data-theme="mono-light"]   { --bg:#FFFFFF; --card:#FFFFFF; --line:#E6E6E6; --fg:#0A0A0A; --fg2:#4A4A4A; --muted:#8A8A8A; --tint:#0A0A0A; --on-accent:#FFFFFF; --cosmos:40,40,40;   --pa:#EDEDED; --btn-bg:#0A0A0A; --btn-fg:#FFFFFF; }
  [data-theme="yellow-dark"]  { --bg:#0B0B0C; --card:#151515; --line:#242424; --fg:#F4F4F4; --fg2:#BDBDBD; --muted:#7C7C7C; --tint:#F5B93A; --on-accent:#0B0B0C; --cosmos:225,225,225; --pa:#F5B93A; --btn-bg:#FAFAFA; --btn-fg:#0B0B0C; }
  [data-theme="mono-dark"]    { --bg:#0A0A0A; --card:#141414; --line:#262626; --fg:#FAFAFA; --fg2:#C8C8C8; --muted:#7A7A7A; --tint:#FAFAFA; --on-accent:#0A0A0A; --cosmos:235,235,235; --pa:#EDEDED; --btn-bg:#FAFAFA; --btn-fg:#0A0A0A; }
  /* Tint fill: yellow->orange gradient for the yellow themes, solid for mono */
  [data-theme="yellow-light"], [data-theme="yellow-dark"] { --tint-grad:linear-gradient(100deg,#FACC15 0%,#FB923C 55%,#EAB308 100%); }
  [data-theme="mono-light"], [data-theme="mono-dark"] { --tint-grad:var(--tint); }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html, body, #root { height:100%; max-width:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden; font-family:'Inter','Noto Sans Devanagari',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; letter-spacing:-0.01em; transition:background .3s ease,color .3s ease; }
  a { color:inherit; text-decoration:none; }

  .cosmos { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.8; }
  .frame { position:relative; z-index:1; width:100%; max-width:1240px; height:100vh; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; border-left:1px solid var(--line); border-right:1px solid var(--line); }

  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 30px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
  .mark { width:28px; height:28px; object-fit:contain; }
  /* Logo is gold; keep it gold in the yellow themes, force pure B&W in the mono themes */
  [data-theme="mono-light"] .mark { filter:brightness(0); }
  [data-theme="mono-dark"] .mark { filter:brightness(0) invert(1); }
  .brand small { font-weight:600; color:var(--muted); letter-spacing:.16em; font-size:10px; text-transform:uppercase; }
  .controls { display:flex; align-items:center; gap:10px; }
  .seg, .themes { display:flex; gap:4px; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .seg button { border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:999px; font:inherit; font-size:12px; font-weight:600; padding:5px 11px; min-width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; transition:all .15s ease; }
  .seg button[aria-pressed="true"] { background:var(--tint-grad); color:var(--on-accent); }
  .themes button { border:1.5px solid transparent; background:transparent; border-radius:999px; width:30px; height:30px; padding:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:border-color .15s ease; }
  .themes button[aria-pressed="true"] { border-color:var(--tint); }
  .chip { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(140,140,140,.42); }
  .chip.cl { background:#fff; } .chip.cd { background:#000; }
  .chip i { width:8px; height:8px; border-radius:50%; }

  .hero { display:grid; grid-template-columns:1fr 0.9fr; min-height:0; }
  .hero > div { padding:30px; min-height:0; }
  .hero .left { border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; }
  .hero .right { position:relative; display:flex; align-items:center; justify-content:center; }
  /* Three AastroAstra engines, branded around the phone */
  .engines { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .eng-cap { position:absolute; top:1%; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; white-space:nowrap; }
  .engine { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 11px; max-width:178px; box-shadow:0 14px 34px -16px rgba(0,0,0,.34); }
  .engine .en { font-size:11.5px; font-weight:800; color:var(--fg); display:flex; align-items:center; gap:5px; }
  .engine .en .dot { width:6px; height:6px; border-radius:50%; background:var(--tint); flex:none; }
  .engine .en .tm { font-size:8px; color:var(--muted); }
  .engine .ed { margin-top:3px; font-size:10px; line-height:1.35; color:var(--muted); }
  .engine.e0 { top:13%; left:0; }
  .engine.e1 { top:47%; right:0; }
  .engine.e2 { bottom:11%; left:2%; }

  h1 { font-family:'Noto Serif',Georgia,serif; font-weight:700; letter-spacing:-0.03em; font-size:clamp(46px,7vw,104px); line-height:0.98; color:var(--tint); }
  /* Yellow theme: warm yellow->orange->gold gradient title (emotica.me palette) */
  [data-theme="yellow-light"] h1, [data-theme="yellow-dark"] h1 { background:linear-gradient(100deg,#FACC15 0%,#FB923C 52%,#EAB308 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .dl-label { margin-top:36px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .btn-play { margin-top:14px; display:inline-flex; align-items:center; gap:14px; background:var(--btn-bg); color:var(--btn-fg); padding:16px 24px; border-radius:12px; width:100%; max-width:340px; transition:transform .15s ease, filter .15s ease; }
  .btn-play:hover { transform:translateY(-1px); filter:brightness(1.05); }
  .btn-play .g { width:26px; height:26px; flex:none; }
  .btn-play .t small { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  .btn-play .t b { display:block; font-size:19px; font-weight:700; }
  .meta { margin-top:14px; font-size:13px; color:var(--muted); }
  .meta b { color:var(--fg); font-weight:600; }
  .apk-direct { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .apk-direct a { color:var(--fg2); border-bottom:1px solid var(--line); }
  .apk-direct a:hover { color:var(--tint); border-color:var(--tint); }

  /* Phone: functional mock of the AastroAstra Android app (dashboard + chat sheet) */
  .phone { position:relative; width:302px; height:min(604px, calc(100vh - 150px)); border-radius:44px; padding:11px; background:#0c0c0f; box-shadow:0 40px 90px -34px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05) inset; transition:transform .35s cubic-bezier(.2,.7,.2,1);
    --d-bg:#FFFBF3; --d-card:#FFFFFF; --d-c2:#FBF4E6; --d-line:#EEE4D2; --d-tp:#2A2118; --d-tm:#8A7A5E; --d-gold:#E0A015; --d-rose:#C97B6B; --d-teal:#00BFA5;
    --d-grad:linear-gradient(100deg,#FACC15 0%,#FB923C 58%,#EAB308 100%); --d-onaccent:#3a2c05; --d-k:#F2911E; --d-kfg:#FFFFFF; }
  /* Phone palette follows the site theme (mirrors the 4 app themes) */
  [data-theme="mono-light"] .phone { --d-bg:#FFFFFF; --d-card:#FFFFFF; --d-c2:#F2F2F2; --d-line:#E6E6E6; --d-tp:#0A0A0A; --d-tm:#8A8A8A; --d-gold:#1A1A1A; --d-rose:#6E6E6E; --d-teal:#3A3A3A; --d-grad:#1A1A1A; --d-onaccent:#FFFFFF; --d-k:#1A1A1A; --d-kfg:#FFFFFF; }
  [data-theme="yellow-dark"] .phone { --d-bg:#0B0B0C; --d-card:#161616; --d-c2:#202020; --d-line:#2A2A2A; --d-tp:#F4F4F4; --d-tm:#9A9A9A; --d-gold:#F5B93A; --d-rose:#C97B6B; --d-teal:#00BFA5; --d-grad:linear-gradient(100deg,#FACC15 0%,#FB923C 58%,#EAB308 100%); --d-onaccent:#3a2c05; --d-k:#F2911E; --d-kfg:#FFFFFF; }
  [data-theme="mono-dark"] .phone { --d-bg:#0A0A0A; --d-card:#161616; --d-c2:#1E1E1E; --d-line:#2A2A2A; --d-tp:#FAFAFA; --d-tm:#9A9A9A; --d-gold:#FAFAFA; --d-rose:#8A8A8A; --d-teal:#BFBFBF; --d-grad:#FAFAFA; --d-onaccent:#0A0A0A; --d-k:#FAFAFA; --d-kfg:#0A0A0A; }
  .phone:hover { transform:translateY(-5px); }
  .screen { position:relative; width:100%; height:100%; border-radius:34px; overflow:hidden; background:var(--d-bg); color:var(--d-tp); display:flex; flex-direction:column; }
  .notch { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:108px; height:23px; background:#000; border-radius:0 0 15px 15px; z-index:6; }

  /* Dashboard */
  .dash { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:32px 13px 62px; scrollbar-width:none; transition:filter .3s ease; }
  .dash::-webkit-scrollbar { display:none; }
  .dash.blur { filter:blur(6px) brightness(.97); }
  .dhead { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .dgreet { font-size:18px; font-weight:800; letter-spacing:-.01em; line-height:1.15; background:var(--d-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .ddate { margin-top:3px; font-size:10.5px; color:var(--d-tm); }
  .drashi { margin-top:5px; font-size:10.5px; color:#8B9DAF; display:flex; align-items:center; gap:5px; }
  .drashi .dot { width:6px; height:6px; border-radius:50%; background:#8B9DAF; display:inline-block; }
  .dgear { flex:none; width:33px; height:33px; border-radius:50%; background:var(--d-c2); color:var(--d-gold); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .card { background:var(--d-card); border:1px solid var(--d-line); border-radius:15px; padding:12px 13px; margin-top:11px; }
  .clabel { display:flex; align-items:center; gap:6px; font-size:8.5px; font-weight:800; letter-spacing:.14em; }
  .clabel .g { background:var(--d-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .clabel .r { margin-left:auto; color:var(--d-gold); font-weight:700; font-size:9.5px; letter-spacing:.02em; }
  .pgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:9px; }
  .pgrid .pl { font-size:7px; letter-spacing:.05em; color:var(--d-tm); font-weight:700; }
  .pgrid .pv { margin-top:2px; font-size:10.5px; font-weight:700; color:var(--d-gold); line-height:1.15; }
  .psun { margin-top:8px; font-size:9.5px; color:var(--d-tm); }
  .hbody { margin-top:7px; font-size:11px; line-height:1.5; color:var(--d-tp); }
  .dacts { display:flex; gap:8px; margin-top:11px; }
  .dact { flex:1; border-radius:14px; padding:12px 10px; color:#fff; display:flex; flex-direction:column; gap:5px; font-weight:800; font-size:11.5px; }
  .dact .i { font-size:14px; }
  .dact.k { background:var(--d-k); color:var(--d-kfg); }
  .dact.m { background:var(--d-rose); }
  .mm { margin-top:8px; background:var(--d-grad); color:var(--d-onaccent); border-radius:14px; padding:11px 13px; }
  .mmrow { display:flex; align-items:center; gap:8px; font-weight:800; font-size:12.5px; }
  .mmrow .i { font-size:14px; }
  .mmrow .eng { margin-left:auto; font-size:8px; font-weight:800; letter-spacing:.12em; padding:2px 7px; border-radius:999px; background:rgba(0,0,0,.16); }
  .mms { margin-top:3px; font-size:10px; opacity:.85; font-weight:600; }
  .slabel { margin-top:15px; font-size:8.5px; font-weight:800; letter-spacing:.16em; color:var(--d-tm); }
  .nums { display:flex; gap:7px; margin-top:9px; }
  .numbox { flex:1; background:var(--d-c2); border-radius:11px; padding:9px 4px; text-align:center; }
  .numbox .n { font-size:21px; font-weight:800; color:var(--d-gold); line-height:1; }
  .numbox .nl { margin-top:4px; font-size:7px; letter-spacing:.04em; color:var(--d-tm); font-weight:700; }
  .numline { margin-top:10px; font-size:10.5px; line-height:1.5; color:var(--d-tp); }
  .dgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:9px; }
  .fcard { background:var(--d-card); border:1px solid var(--d-line); border-radius:14px; padding:12px; }
  .fcard .fi { font-size:19px; }
  .fcard .ft { margin-top:7px; font-size:11.5px; font-weight:800; }
  .fcard .fs { margin-top:2px; font-size:9.5px; color:var(--d-tm); }
  .dbrand { display:flex; align-items:center; gap:10px; margin-top:11px; background:var(--d-card); border:1px solid var(--d-line); border-radius:14px; padding:11px 12px; }
  .dbrand .bi { flex:none; width:29px; height:29px; border-radius:50%; background:var(--d-grad); color:var(--d-onaccent); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .dbrand .bt { font-size:12.5px; font-weight:800; background:var(--d-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .dbrand .bs { font-size:9.5px; color:var(--d-tm); }
  .dbrand .bc { margin-left:auto; color:var(--d-tm); font-size:16px; }

  /* Bottom nav */
  .dnav { position:absolute; left:0; right:0; bottom:0; height:50px; background:var(--d-card); border-top:1px solid var(--d-line); display:flex; z-index:5; }
  .dnav button { flex:1; border:none; background:transparent; cursor:pointer; font:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--d-tm); font-size:9px; font-weight:700; }
  .dnav button .ni { font-size:14px; }
  .dnav button.on { color:var(--d-gold); }

  /* Chat bottom sheet */
  .dim { position:absolute; inset:0; background:rgba(20,14,4,.30); opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:7; }
  .dim.on { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; left:0; right:0; bottom:0; height:90%; background:var(--d-bg); border-radius:22px 22px 34px 34px; box-shadow:0 -18px 40px -18px rgba(0,0,0,.35); transform:translateY(100%); transition:transform .34s cubic-bezier(.2,.75,.2,1); z-index:8; display:flex; flex-direction:column; overflow:hidden; }
  .sheet.on { transform:translateY(0); }
  .shandle { width:38px; height:4px; border-radius:2px; background:var(--d-line); margin:8px auto 4px; flex:none; }
  .chead { padding:4px 14px 10px; border-bottom:1px solid var(--d-line); flex:none; }
  .chead .r1 { display:flex; align-items:center; gap:7px; }
  .chead .ct { font-size:14.5px; font-weight:800; background:var(--d-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .chead .quota { margin-left:auto; font-size:9.5px; font-weight:800; color:#8B9DAF; background:var(--d-c2); border-radius:999px; padding:3px 9px; }
  .chead .cx { width:24px; height:24px; border-radius:50%; border:none; background:var(--d-c2); color:var(--d-tm); font-size:15px; cursor:pointer; line-height:1; }
  .chead .sub { margin-top:4px; font-size:9.5px; color:var(--d-teal); }
  .kchip { margin-top:8px; background:var(--d-c2); border-radius:9px; padding:7px 9px; font-size:9.5px; color:var(--d-tm); display:flex; align-items:center; gap:5px; }
  .kchip .ch { margin-left:auto; color:var(--d-gold); font-weight:700; }
  .cmsgs { flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:9px; scrollbar-width:none; }
  .cmsgs::-webkit-scrollbar { display:none; }
  .bubble { max-width:82%; font-size:12px; line-height:1.5; padding:10px 12px; }
  .bubble.ai { align-self:flex-start; background:var(--d-card); border:1px solid var(--d-line); border-left:3px solid var(--d-teal); border-radius:4px 14px 14px 14px; color:var(--d-tp); }
  .bubble.ai b { color:var(--d-gold); font-weight:700; }
  .bubble.me { align-self:flex-end; background:var(--d-grad); color:var(--d-onaccent); font-weight:600; border-radius:14px 14px 4px 14px; }
  .typing { align-self:flex-start; display:flex; gap:4px; padding:12px 13px; background:var(--d-card); border:1px solid var(--d-line); border-radius:4px 14px 14px 14px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--d-tm); animation:blink 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s; } .typing i:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,60%,100%{ opacity:.3; } 30%{ opacity:1; } }
  @keyframes fade { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .cchips { display:flex; gap:6px; padding:8px 14px 4px; overflow-x:auto; flex:none; scrollbar-width:none; }
  .cchips::-webkit-scrollbar { display:none; }
  .cchips button { flex:none; white-space:nowrap; border:none; background:var(--d-c2); color:var(--d-tp); border-radius:999px; padding:7px 12px; font:inherit; font-size:10px; cursor:pointer; }
  .cinput { display:flex; gap:8px; padding:8px 14px 14px; flex:none; align-items:center; }
  .cinput input { flex:1; min-width:0; background:var(--d-c2); border:none; border-radius:999px; padding:11px 14px; font:inherit; font-size:11.5px; color:var(--d-tp); outline:none; }
  .cinput .send { flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--d-teal); color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  footer { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); }
  footer > * { padding:16px 30px; font-size:13px; color:var(--muted); }
  footer > *:not(:last-child) { border-right:1px solid var(--line); }
  footer a:hover { color:var(--tint); }
  .tm { text-align:right; }

  @media (max-width:900px) {
    html, body, #root { height:auto; } body { overflow:auto; }
    .frame { height:auto; min-height:100vh; }
    .hero { grid-template-columns:1fr; }
    /* Mobile/stacked: center the title, subtitle and button */
    .hero .left { border-right:none; border-bottom:1px solid var(--line); align-items:center; text-align:center; }
    .dl-label, .meta, .apk-direct { text-align:center; }
    .btn-play { justify-content:center; }
    .hero > div { padding:34px 20px; }
    .hero .right { padding:24px 20px 44px; }
    footer { grid-template-columns:1fr; }
    footer > *:not(:last-child) { border-right:none; border-bottom:1px solid var(--line); }
    .tm { text-align:left; }
  }
  @media (max-width:560px) {
    header { flex-wrap:wrap; row-gap:12px; padding:16px 18px; }
    .brand { flex:1 1 auto; } .controls { width:100%; justify-content:space-between; }
    .hero > div { padding:30px 18px; } h1 { font-size:clamp(38px,12vw,64px); }
    /* Smaller phone on real mobile */
    .phone { width:248px; height:min(508px, calc(100vh - 120px)); border-radius:38px; padding:9px; }
    .phone .screen { border-radius:30px; }
  }
  /* Intro splash: logo appears, then fades to reveal the site */
  #splash { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:#FFFFFF; transition:opacity .55s ease; }
  #splash img { width:104px; height:104px; object-fit:contain; animation:splashIn 1.15s cubic-bezier(.2,.7,.2,1) both; }
  #splash.hide { opacity:0; pointer-events:none; }
  @keyframes splashIn { 0%{ opacity:0; transform:scale(.82); } 45%{ opacity:1; transform:scale(1); } 100%{ opacity:1; transform:scale(1.02); } }
</style>
</head>
<body>
  <div id="splash"><img src="logo-mark.png" alt="AastroAstra" /></div>
  <script>
    (function(){
      var sp=document.getElementById('splash'); if(!sp) return;

              h('input', { value:input, placeholder:T(CHAT.placeholder), onChange:function(e){ setInput(e.target.value); }, onKeyDown:function(e){ if(e.key==='Enter') send(input); } }),
              h('button', { className:'send', onClick:function(){ send(input); } }, '➤')
            )
          )
        )
      );
    }
    var COPY = {
      dl:{en:'Download the beta',hi:'बीटा डाउनलोड करें'}, getapp:{en:'Get the Android app',hi:'एंड्रॉइड ऐप लें'},
      download:{en:'Download Beta',hi:'बीटा डाउनलोड'}, privacy:{en:'Privacy Policy',hi:'गोपनीयता नीति'}, terms:{en:'Terms of Use',hi:'उपयोग की शर्तें'},
      presskit:{en:'Press Kit',hi:'प्रेस किट'},
    };
    var THEMES = [ ['yellow-light','cl','#E0A015','Yellow · Light'], ['mono-light','cl','#111111','B&W · Light'], ['yellow-dark','cd','#F5B93A','Yellow · Dark'], ['mono-dark','cd','#FFFFFF','B&W · Dark'] ];
    var META = { 'yellow-light':'#FFFFFF','mono-light':'#FFFFFF','yellow-dark':'#0B0B0C','mono-dark':'#0A0A0A' };

    function App(){
      var tS=useState('yellow-light'), theme=tS[0], setTheme=tS[1];
      var lS=useState('en'), lang=lS[0], setLang=lS[1];
      var vS=useState({ver:'0.2.1',size:'5.8',apk:SUPA+'aastroastra-latest.apk',updated:''}), ver=vS[0], setVer=vS[1];
      useEffect(function(){
        var saved; try{ saved=localStorage.getItem('aa-theme'); }catch(e){}
        if(!META[saved]) saved=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'yellow-dark':'yellow-light';
        applyTheme(saved);
        try{ var lg=localStorage.getItem('aa-lang'); if(lg) setLang(lg); }catch(e){}
        fetch(SUPA+'version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(v){ if(v) setVer({ver:v.version||'0.2.1',size:v.sizeMb||'5.8',apk:v.apk||(SUPA+'aastroastra-latest.apk'),updated:v.updated||v.date||''}); }).catch(function(){});
      }, []);
      function applyTheme(t){ if(!META[t]) t='yellow-light'; document.documentElement.setAttribute('data-theme',t); var mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=META[t]; setTheme(t); try{ localStorage.setItem('aa-theme',t); }catch(e){} }
      function pickLang(l){ setLang(l); try{ localStorage.setItem('aa-lang',l); }catch(e){} }

      var themeBtns=THEMES.map(function(x){ return h('button',{key:x[0],title:x[3],'aria-pressed':theme===x[0],onClick:function(){applyTheme(x[0]);}}, h('span',{className:'chip '+x[1]}, h('i',{style:{background:x[2]}}))); });
      var langBtns=[['en','EN'],['hi','हिं']].map(function(x){ return h('button',{key:x[0],'aria-pressed':lang===x[0],onClick:function(){pickLang(x[0]);}},x[1]); });

      return h(React.Fragment, null,
        h(Cosmos, { theme:theme }),
        h('main', { className:'frame' },
          h('header', null,
            h('div', { className:'brand' },
              h('img', { className:'mark', src:'logo-mark.png', alt:'AastroAstra', width:28, height:28 }),
              h('span', null, 'AastroAstra'), h('small', null, 'Beta')
            ),
            h('div', { className:'controls' },
              h('div', { className:'seg', role:'group','aria-label':'Language' }, langBtns),
              h('div', { className:'themes', role:'group','aria-label':'Theme' }, themeBtns)
            )
          ),
          h('section', { className:'hero' },
            h('div', { className:'left' },
              h('h1', null, 'One who', h('br'), 'believes'),
              h('div', { className:'dl-label' }, COPY.dl[lang]),
              h('a', { className:'btn-play', href:ver.apk, rel:'noopener' },
                h('svg',{className:'g',viewBox:'0 0 512 512','aria-hidden':'true'},
                  h('path',{d:'M47 32c-9 5-15 15-15 28v392c0 13 6 23 15 28l224-224L47 32z',fill:'currentColor'}),
                  h('path',{d:'M336 176L83 33c-9-5-18-5-25-1l224 224 54-80z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 336l-54-80-224 224c7 4 16 4 25-1l253-143z',fill:'currentColor',opacity:'0.82'}),
                  h('path',{d:'M336 176l-54 80 54 80 94-53c17-10 17-44 0-54l-94-53z',fill:'currentColor',opacity:'0.6'})),
                h('div',{className:'t'}, h('small',null,COPY.getapp[lang]), h('b',null,COPY.download[lang]))
              ),
              h('div', { className:'meta' }, 'Version ', h('b',null,ver.ver), ' · Android APK · ', ver.size, ' MB'),
              ver.updated ? h('div', { className:'meta' }, (lang==='hi'?'अंतिम अपडेट: ':'Last updated: '), h('b',null,ver.updated)) : null,
              h('div', { className:'apk-direct' }, 'Direct link: ', h('a',{href:ver.apk},'aastroastra-latest.apk'))
            ),
            h('div', { className:'right' }, h(Phone, { lang:lang }), h(Engines, { lang:lang }))
          ),
          h('footer', null,
            h('a', { href:'./privacy.html' }, COPY.privacy[lang]),
            h('a', { href:'./terms.html' }, COPY.terms[lang]),
            h('a', { href:'./presskit.zip', download:true }, COPY.presskit[lang]),
            h('div', { className:'tm' }, 'AastroAstra™ · © ' + (new Date().getFullYear()))
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  })();
  </script>
</body>
